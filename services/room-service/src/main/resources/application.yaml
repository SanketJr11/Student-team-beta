server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: room-service

  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:mysql://${DB_HOST:classroom-dev-db.cvwy4uckycwn.eu-west-1.rds.amazonaws.com}:${DB_PORT:3306}/${ROOM_DB_NAME:room_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

  flyway:
    enabled: true
    baseline-on-migrate: true

eureka:
  client:
    enabled: false

jwt:
  secret: ${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS_123456}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

booking-service:
  base-url: ${BOOKING_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}      