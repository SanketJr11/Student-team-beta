apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service
          image: sanketshetty23/auth-service:latest

          ports:
            - containerPort: 8084

          env:
            - name: SERVER_PORT
              value: "8084"