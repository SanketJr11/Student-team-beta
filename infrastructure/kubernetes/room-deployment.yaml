apiVersion: apps/v1
kind: Deployment
metadata:
  name: room-service
  labels:
    app: room-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: room-service

  template:
    metadata:
      labels:
        app: room-service

    spec:
      containers:
        - name: room-service
          image: sanketshetty23/room-service:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8081

          env:
            - name: SERVER_PORT
              value: "8081"

            - name: SPRING_CLOUD_CONFIG_ENABLED
              value: "false"

            - name: EUREKA_CLIENT_ENABLED
              value: "false"

            - name: DB_HOST
              value: "classroom-dev-db.cvwy4uckycwn.eu-west-1.rds.amazonaws.com"

            - name: DB_PORT
              value: "3306"

            - name: ROOM_DB_NAME
              value: "room_db"

            - name: DB_USER
              value: "admin"

            - name: DB_PASSWORD
              value: "admin123"

            - name: JWT_SECRET
              value: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS_123456"

            - name: JWT_EXPIRATION_MS
              value: "3600000"

            - name: BOOKING_SERVICE_URL
              value: "http://booking-service:8083"

            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Xms64m
                -Xmx256m
                -XX:MaxMetaspaceSize=128m
                -XX:+UseSerialGC

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "450Mi"
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5