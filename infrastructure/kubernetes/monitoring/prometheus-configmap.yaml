apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: auth-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - auth-service.default.svc.cluster.local:8084

      - job_name: room-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - room-service.default.svc.cluster.local:8081

      - job_name: booking-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - booking-service.default.svc.cluster.local:8083